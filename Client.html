/* utils.js — small, dependency-free helpers (dates, escaping, CSV, cloning). */
(function (g) {
  'use strict';

  const Dates = {
    fmt(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    },
    parse(iso) {
      const p = iso.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    },
    today() { return Dates.fmt(new Date()); },
    add(iso, n) { const d = Dates.parse(iso); d.setDate(d.getDate() + n); return Dates.fmt(d); },
    /** Whole days from a to b (positive when b is later). */
    diff(a, b) {
      const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
      return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
    },
    isValid(iso) { return typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(iso) && Dates.fmt(Dates.parse(iso)) === iso; },
    display(iso) {
      if (!iso) return '—';
      return Dates.parse(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  /** Natural, null-last comparison used by every sortable table. */
  function compare(a, b) {
    const ae = a == null || a === '', be = b == null || b === '';
    if (ae && be) return 0;
    if (ae) return 1;
    if (be) return -1;
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
  }

  function debounce(fn, ms) {
    let t;
    return function () {
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, ms == null ? 200 : ms);
    };
  }

  /** CSV with quoting and spreadsheet-formula-injection protection. */
  function toCSV(columns, rows) {
    const q = function (v) {
      v = v == null ? '' : String(v);
      if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;

    };

    'pick-report': function (el) { switchReport(el.dataset.id); },
    'export-csv': exportCsv,
    'copy-csv': copyCsv,
    'clear-filters': function (el) {
      const p = el.dataset.id;
      App.filters[p] = p === 'reports' ? { report: (App.filters.reports || {}).report || 'inventory' } : clone(Pages[p].defaults);
      UI.resetPage(p === 'reports' ? 'report' : p);
      Pages[p].render($('content'));
    },
    'remove-option': async function (el) {
      const list = el.dataset.list, value = el.dataset.value;
      let n = 0; try { n = await DataService.getListUsage(list, value); } catch (e) { /* ignore */ }
      if (!(await UI.confirm({ title: 'Remove “' + value + '”?', tone: 'danger', confirmText: 'Remove', message: '<p>Remove this option from <strong>' + E(list) + '</strong>?' + (n ? ' It is used by ' + n + ' record(s) and cannot be removed.' : ' Existing records are not affected.') + '</p>' }))) return;
      try { await DataService.removeListValue(list, value); await App.afterChange('“' + value + '” removed from ' + list + '.'); }
      catch (err) { UI.toast(err.message, 'error', 'Not removed'); }
    },
    'simulate-error': function () { DataService.config.failNext = true; UI.toast('The next page load will fail once so you can see the error state.', 'info'); App.go('overview'); },
    'reset-demo': async function () {
      if (!(await UI.confirm({ title: 'Reset demo data?', tone: 'danger', confirmText: 'Reset demo data', message: '<p>All changes made in this browser will be replaced by the original sample data.</p>' }))) return;
      try { await DataService.resetDemoData(); App.filters = {}; UI.closeAllModals(); await App.afterChange('Demo data reset to the original sample records.'); }
      catch (err) { UI.toast(err.message, 'error'); }
    }
  };

  function bindEvents() {
    document.addEventListener('click', function (ev) {
      const sort = ev.target.closest('[data-sort]');
      if (sort) {
        const parts = sort.dataset.sort.split('|'), st = UI.tableState[parts[0]] = UI.tableState[parts[0]] || { sort: null, page: 1 };
        if (!st.sort || st.sort.key !== parts[1]) st.sort = { key: parts[1], dir: 'asc' }; else if (st.sort.dir === 'asc') st.sort.dir = 'desc'; else st.sort = null;
        st.page = 1;
        const p = parts[0] === 'report' ? 'reports' : parts[0];
        if (Pages[p] && p === App.route) Pages[p].results();
        return;
      }
      const pg = ev.target.closest('[data-page]');
      if (pg && pg.dataset.page.indexOf('|') !== -1) {
        const parts = pg.dataset.page.split('|');
        UI.tableState[parts[0]].page = parseInt(parts[1], 10);
        const p = parts[0] === 'report' ? 'reports' : parts[0];
        if (Pages[p] && p === App.route) { Pages[p].results(); const t = $('results'); if (t) t.scrollIntoView({ block: 'nearest' }); }
        return;
      }
      const a = ev.target.closest('[data-action]');
      if (a) {
        if (a.hasAttribute('data-close-search')) { $('search-results').hidden = true; searchInput().value = ''; }
        const fn = Actions[a.dataset.action];
        if (fn) { ev.preventDefault(); fn(a, ev); }
        return;
      }
      if (!ev.target.closest('.search-wrap')) $('search-results').hidden = true;
    });

    const onFilter = function (ev) {
      const el = ev.target.closest('[data-filter]');
      if (!el) return;
      const parts = el.dataset.filter.split(':');
      if (ev.type === 'input' && el.tagName === 'INPUT' && el.type === 'search') { clearTimeout(el._t); el._t = setTimeout(function () { setFilter(parts[0], parts[1], el.value); }, 180); return; }
      if (ev.type === 'change') setFilter(parts[0], parts[1], el.value);
    };
    document.addEventListener('input', onFilter);
    document.addEventListener('change', onFilter);

    document.addEventListener('submit', async function (ev) {
      const f = ev.target.closest('form.add-option');
      if (!f) return;
      ev.preventDefault();
      const list = f.dataset.list, input = f.querySelector('input');
      try { await DataService.addListValue(list, input.value); await App.afterChange('“' + input.value.trim() + '” added to ' + list + '.'); }
      catch (err) { UI.toast(err.message, 'error', 'Not added'); input.focus(); }
    });

    window.addEventListener('hashchange', function () { App.render(); });
    const si = searchInput();
    si.addEventListener('input', runSearch);
    si.addEventListener('focus', runSearch);
    si.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { $('search-results').hidden = true; si.blur(); }
      if (e.key === 'Enter') { const first = $('search-results').querySelector('.sr-item'); if (first) first.click(); }
    });
    window.addEventListener('resize', debounce(function () { if (!window.matchMedia('(max-width: 900px)').matches) closeMobileNav(); }, 150));
  }

  function init() {
    buildNav();
    bindEvents();
    if (DataService.isLive()) {
      const pill = $('mode-pill');
      pill.textContent = 'LIVE · GOOGLE SHEETS'; pill.classList.add('live-pill'); pill.title = 'Connected to your Google Sheet. Changes are saved to the spreadsheet.';
      $('storage-note').textContent = 'Connected to Google Sheets.';
      DataService.getUser().then(function (u) {
        App.user = u;
        $('profile-name').textContent = u.email;
        $('avatar').textContent = (u.email || '?').slice(0, 2).toUpperCase();
      }).catch(function () { /* the page itself reports connection problems */ });
    } else {
      $('storage-note').textContent = DataService.isPersistent() ? 'Changes are saved in this browser only.' : 'Changes last until you refresh this page.';
    }
    App.render({ focus: false });
  }

  g.App = App;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
